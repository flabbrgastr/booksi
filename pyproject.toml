[project]
name = "booksi"
dynamic = ["version"]
description = "Web scraping and data processing tool for adult entertainment listings"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "flabbrgastr" },
]
dependencies = [
    "beautifulsoup4>=4",
    "pandas>=2",
    "tqdm>=4",
    "wcwidth>=0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "booksi/__init__.py"
