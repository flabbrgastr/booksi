# Catch-all — always prompt for auth, no valid credentials exist
server {
    listen 8007 ssl default_server;
    listen [::]:8007 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/booksi.duckdns.org.crt;
    ssl_certificate_key /etc/ssl/private/booksi.duckdns.org.key;

    auth_basic "booksi Login";
    auth_basic_user_file /etc/nginx/.htpasswd-booksi-empty;
}

server {
    listen 8007 ssl;
    listen [::]:8007 ssl;

    server_name booksi.duckdns.org;

    ssl_certificate /etc/ssl/certs/booksi.duckdns.org.crt;
    ssl_certificate_key /etc/ssl/private/booksi.duckdns.org.key;

    root /var/www/booksi;
    index all.html;

    auth_basic "booksi Login";
    auth_basic_user_file /etc/nginx/.htpasswd-booksi;

    location / {
        try_files $uri $uri/ =404;
    }
}
