# Catch-all — always prompt for auth, no valid credentials exist
server {
    listen 8007 default_server;
    listen [::]:8007 default_server;
    server_name _;

    auth_basic "booksi Login";
    auth_basic_user_file /etc/nginx/.htpasswd-booksi-empty;
}

server {
    listen 8007;
    listen [::]:8007;

    server_name booksi.duckdns.org;

    root /var/www/booksi;
    index all.html;

    auth_basic "booksi Login";
    auth_basic_user_file /etc/nginx/.htpasswd-booksi;

    location / {
        try_files $uri $uri/ =404;
    }
}
